# The weekend league's server. Phase 2 (17.10): local only, run with
#   npx wrangler dev -c wrangler.weekend.toml --port 8788 --var DEBUG:1
# and exercised by scripts/duel-smoke.mts and scripts/weekend-smoke.mts.
# Not deployed until the pilot; see WEEKEND.md in the project root.
# Before deploying: npx wrangler secret put PRIZE_SECRET -c wrangler.weekend.toml
name = "beapro-weekend"
main = "src/weekend.ts"
compatibility_date = "2026-09-01"
workers_dev = false

[durable_objects]
bindings = [
  { name = "MATCH", class_name = "MatchDO" },
  { name = "LEAGUE", class_name = "LeagueDO" },
  { name = "LOBBY", class_name = "LobbyDO" },
]

[[migrations]]
tag = "v1"
new_classes = ["MatchDO"]

[[migrations]]
tag = "v2"
new_classes = ["LeagueDO", "LobbyDO"]
