<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#050907" />
    <meta name="description" content="קח קבוצה מליגה ג׳ עד לפסגה. משחק מנהל כדורגל ישראלי." />

    <!--
      How the link looks when somebody sends it on.

      This game spreads by one person sending it to another on WhatsApp, and a
      link with no card is a bare address nobody taps. The addresses here are
      absolute on purpose: WhatsApp and every other unfurler fetches the page
      from outside and cannot resolve a relative one, so %BASE_URL% would be no
      use. share.jpg is 1200x630 and under 300KB, which is what WhatsApp will
      render; the words are the game's own, off the title screen.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BE A PRO" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:url" content="https://beapromanager.github.io/" />
    <meta property="og:title" content="BE A PRO · מהשכונה עד אירופה" />
    <meta property="og:description" content="קח קבוצה מליגה ג׳ ותוביל אותה עד אלופת אירופה. טירוף ישראלי, יציע שלא סולח, וחלום אחד גדול." />
    <meta property="og:image" content="https://beapromanager.github.io/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="מאמן על קו הצד, יציע מלא ולפידים" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BE A PRO · מהשכונה עד אירופה" />
    <meta name="twitter:description" content="קח קבוצה מליגה ג׳ ותוביל אותה עד אלופת אירופה. טירוף ישראלי, יציע שלא סולח, וחלום אחד גדול." />
    <meta name="twitter:image" content="https://beapromanager.github.io/share.jpg" />

    <!-- launches full screen, like an app, when added to the home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BE A PRO" />
    <title>BE A PRO</title>

    <!-- the coach is the face of the game, so it is the home-screen icon too -->
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
